<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎉</title>
    <link rel="stylesheet" href="styles/birthday.css">
</head>
<body>
    <div class="container">
        <canvas id="confetti"></canvas>
        
        <div class="birthday-card">
            <div class="balloon-container">
                <div class="balloon balloon-1">🎈</div>
                <div class="balloon balloon-2">🎈</div>
                <div class="balloon balloon-3">🎈</div>
            </div>
            
            <h1 class="title">Happy Birthday!</h1>
            
            <div class="cake-container">
                <div class="cake">
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    🎂
                </div>
            </div>
            
            <p class="message">
                Wishing you a day filled with happiness,<br>
                laughter, and all your favorite things!<br>
                May this year bring you endless joy! 🎉
            </p>
            
            <button class="wish-button" id="wishButton">Make a Wish! ✨</button>
            
            <div class="stars-container" id="starsContainer"></div>
        </div>
    </div>
    
    <script src="scripts/birthday.js"></script>
</body>
</html>
